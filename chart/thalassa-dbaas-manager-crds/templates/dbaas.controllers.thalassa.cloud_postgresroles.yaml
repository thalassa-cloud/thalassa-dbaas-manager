---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: postgresroles.dbaas.controllers.thalassa.cloud
spec:
  group: dbaas.controllers.thalassa.cloud
  names:
    kind: PostgresRole
    listKind: PostgresRoleList
    plural: postgresroles
    singular: postgresrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.resourceId
      name: Resource ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: PostgresRole is the Schema for the PostgreSQL role API (role
          on a Thalassa DB cluster).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresRoleSpec defines the desired state of a PostgreSQL
              role on a Thalassa DB cluster.
            properties:
              clusterRef:
                description: ClusterRef references the PostgresCluster (or cluster
                  by identity) that this role belongs to.
                properties:
                  identity:
                    description: Identity is the Thalassa DB cluster identity. If
                      set, the controller uses this directly instead of resolving
                      from the PostgresCluster resource.
                    type: string
                  name:
                    description: Name is the name of the PostgresCluster resource
                      in Kubernetes.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the PostgresCluster
                      resource. Defaults to the same namespace as the referencing
                      resource.
                    type: string
                type: object
              connectionLimit:
                description: ConnectionLimit is the maximum number of concurrent connections
                  for the role. -1 means no limit (PostgreSQL default).
                format: int64
                type: integer
              createDb:
                description: CreateDb allows the role to create databases (CREATEDB
                  attribute).
                type: boolean
              createRole:
                description: CreateRole allows the role to create other roles (CREATEROLE
                  attribute).
                type: boolean
              generatePassword:
                default: true
                description: |-
                  GeneratePassword, when true and WriteConnectionSecretToRef is set, generates a random password for the role and writes it to the secret.
                  The generated password is used when creating or updating the role in Thalassa.
                type: boolean
              login:
                default: true
                description: Login allows the role to log in (LOGIN attribute).
                type: boolean
              name:
                description: Name is the PostgreSQL role name (CREATE ROLE name).
                type: string
              passwordSecretRef:
                description: PasswordSecretRef references a Kubernetes Secret key
                  containing the role password. If not set, password is not set or
                  changed.
                properties:
                  key:
                    description: Key is the key in the Secret whose value will be
                      used.
                    type: string
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the Secret. Defaults
                      to the same namespace as the referencing resource.
                    type: string
                required:
                - key
                - name
                type: object
              validUntil:
                description: ValidUntil is the date and time the role will expire
                  (VALID UNTIL). Omit for no expiry.
                format: date-time
                type: string
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToRef optionally creates or updates a Secret with connection details (host, port, username, password, database, connection string).
                  When set, the controller will create or update the referenced Secret with keys: username, password, host, port, database, uri (or connectionString).
                  If GeneratePassword is true, a random password is generated and used for the role; otherwise the password is read from PasswordSecretRef (if set).
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the Secret. Defaults
                      to the same namespace as the referencing resource.
                    type: string
                required:
                - name
                type: object
            required:
            - clusterRef
            - name
            type: object
          status:
            description: PostgresRoleStatus defines the observed state of PostgresRole.
            properties:
              conditions:
                description: Conditions represent the current state of the PostgresRole.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileError:
                description: LastReconcileError is the last error message from reconcile,
                  if any. Cleared on success.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              resourceId:
                description: ResourceID is the Thalassa identity of the PostgreSQL
                  role.
                type: string
              resourceStatus:
                description: ResourceStatus is the status of the resource in Thalassa
                  (e.g. ready, pending).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
