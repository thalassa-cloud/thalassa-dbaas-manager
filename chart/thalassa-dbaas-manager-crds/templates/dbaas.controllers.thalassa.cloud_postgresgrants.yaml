              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresGrantSpec defines the desired state of a PostgreSQL
              grant on a Thalassa DB cluster.
