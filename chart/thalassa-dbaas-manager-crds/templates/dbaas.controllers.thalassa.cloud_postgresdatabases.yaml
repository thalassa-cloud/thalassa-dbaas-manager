---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: postgresdatabases.dbaas.controllers.thalassa.cloud
spec:
  group: dbaas.controllers.thalassa.cloud
  names:
    kind: PostgresDatabase
    listKind: PostgresDatabaseList
    plural: postgresdatabases
    singular: postgresdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.resourceId
      name: Resource ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.owner
      name: Owner
      priority: 1
      type: string
    - jsonPath: .spec.name
      name: Database Name
      priority: 1
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: PostgresDatabase is the Schema for the PostgreSQL database API
          (database on a Thalassa DB cluster).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresDatabaseSpec defines the desired state of a PostgreSQL
              database on a Thalassa DB cluster.
            properties:
              allowConnections:
                description: AllowConnections allows connections to the database.
                  If false, no one can connect. Defaults to true.
                type: boolean
              clusterRef:
                description: ClusterRef references the PostgresCluster (or cluster
                  by identity) that this database belongs to.
                properties:
                  identity:
                    description: Identity is the Thalassa DB cluster identity. If
                      set, the controller uses this directly instead of resolving
                      from the PostgresCluster resource.
                    type: string
                  name:
                    description: Name is the name of the PostgresCluster resource
                      in Kubernetes.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the PostgresCluster
                      resource. Defaults to the same namespace as the referencing
                      resource.
                    type: string
                type: object
              connectionLimit:
                description: ConnectionLimit is the maximum number of concurrent connections
                  to the database. -1 means no limit (PostgreSQL default).
                type: integer
              extensions:
                description: Extensions is a list of PostgreSQL extensions to enable
                  on the database.
                items:
                  description: PostgresDatabaseExtension specifies a PostgreSQL extension
                    to enable on the database.
                  properties:
                    name:
                      description: Name is the name of the extension (e.g. pg_trgm,
                        uuid-ossp).
                      type: string
                  required:
                  - name
                  type: object
                type: array
              name:
                description: Name is the PostgreSQL database name (CREATE DATABASE
                  name).
                type: string
              owner:
                description: Owner is the name of the PostgreSQL role that owns the
                  database (OWNER attribute).
                type: string
            required:
            - clusterRef
            - name
            - owner
            type: object
          status:
            description: PostgresDatabaseStatus defines the observed state of PostgresDatabase.
            properties:
              conditions:
                description: Conditions represent the current state of the PostgresDatabase.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileError:
                description: LastReconcileError is the last error message from reconcile,
                  if any. Cleared on success.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              resourceId:
                description: ResourceID is the Thalassa identity of the PostgreSQL
                  database.
                type: string
              resourceStatus:
                description: ResourceStatus is the status of the resource in Thalassa
                  (e.g. ready, pending).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
