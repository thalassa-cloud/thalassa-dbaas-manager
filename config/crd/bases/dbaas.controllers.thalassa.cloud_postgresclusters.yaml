                    type: string
                  locale:
                    description: Locale maps to LOCALE. Cannot be changed after creation.
                    type: string
                  localeCType:
                    description: LocaleCType maps to LC_CTYPE. Cannot be changed after
                      creation.
                    type: string
                  localeCollate:
                    description: LocaleCollate maps to LC_COLLATE. Cannot be changed
                      after creation.
                    type: string
                type: object
              instanceType:
                description: InstanceType references the instance type to use for
                  the cluster instances.
                properties:
                  id:
                    description: ID is the Thalassa instance type identity.
                    type: string
