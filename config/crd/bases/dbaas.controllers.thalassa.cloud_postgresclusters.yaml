                  PostgresVersion is the PostgreSQL major version (e.g. "15", "16", "17") or full version (e.g. "16.10").
                  The controller resolves this to a Thalassa engine version identity.
                type: string
              securityGroups:
                description: SecurityGroupRefs reference security groups to attach.
                items:
                  description: |-
                    SecurityGroupRef references a security group by Thalassa identity, label selector, or an IaaS SecurityGroup CR (TypedObjectReference).
                    When multiple fields are set, identity takes precedence, then selector, then securityGroupRef.
                  properties:
