              initDb:
                description: InitDb specifies PostgreSQL initdb options.
                properties:
                  dataChecksums:
                    description: DataChecksums enables data checksums (initdb --data-checksums).
                    type: boolean
                  encoding:
                    description: Encoding maps to ENCODING (character set). Cannot
