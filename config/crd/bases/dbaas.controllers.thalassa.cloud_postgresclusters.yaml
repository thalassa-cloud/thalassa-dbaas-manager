                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpointHost:
                description: EndpointHost is the host (IP or hostname) for connecting
                  to the primary endpoint.
                type: string
              engineVersion:
                description: EngineVersion is the resolved PostgreSQL engine version
                  (e.g. "16.10").
                type: string
              instanceCount:
                description: InstanceCount is the number of instances in the cluster.
                type: integer
              instances:
                description: Instances represent the current state of the cluster
                  instances.
                items:
                  properties:
                    allocatedStorage:
                      description: AllocatedStorage is the amount of storage allocated
                        to the instance in GB.
                      type: integer
                    availabilityZone:
                      description: AvailabilityZone is the availability zone of the
                        instance.
                      type: string
                    cpu:
                      description: Cpu is the cpu of the instance in cores.
                      type: integer
                    healthy:
                      description: Healthy is a flag to indicate if the instance is
                        healthy.
                      type: boolean
                    isPrimary:
                      description: IsPrimary is a flag to indicate if the instance
                        is the primary instance.
                      type: boolean
                    isPrimaryTarget:
                      description: IsPrimaryTarget is a flag to indicate if the instance
                        is the target primary instance.
                      type: boolean
                    joining:
                      description: Joining is a flag to indicate if the instance is
                        joining the cluster.
                      type: boolean
                    memory:
                      description: Memory is the memory of the instance in MB.
                      type: integer
                    name:
                      description: Name is the name of the instance.
                      type: string
                    replicating:
                      description: Replicating is a flag to indicate if the instance
                        is replicating.
                      type: boolean
                    timeLineID:
                      description: TimeLineID is the timeline ID of the instance.
                      type: string
                    usedStorage:
                      description: |-
                        UsedStorage is the amount of storage used by the instance in GB.
                        May not always be available - feature gated functionality.
                      type: integer
                    version:
                      description: Version is the version of the instance.
                      type: string
                  type: object
                type: array
              lastReconcileError:
                description: LastReconcileError is the last error message from reconcile,
                  if any. Cleared on success.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this resource.
                format: date-time
                type: string
              managedBackupSchedules:
                description: |-
                  ManagedBackupSchedules lists Thalassa backup schedules created by this controller from spec.backupSchedules (name and identity).
                  Only these schedules are deleted when removed from spec or when spec.backupSchedules is cleared; other API schedules are left untouched.
                items:
                  description: PostgresClusterManagedBackupSchedule records a backup
                    schedule the PostgresCluster controller created in Thalassa.
                  properties:
                    identity:
                      description: Identity is the Thalassa identity of the schedule.
                      type: string
                    name:
                      description: Name is the backup schedule name in Thalassa (matches
                        spec.backupSchedules[].name).
                      type: string
                  required:
                  - identity
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              port:
                description: Port is the port of the primary (read-write) endpoint
                  (typically 5432).
                format: int32
                type: integer
              readOnlyEndpointHost:
                description: ReadOnlyEndpointHost is the host for the read-only endpoint,
                  if available. When empty, use EndpointHost.
                type: string
              readOnlyPort:
                description: ReadOnlyPort is the port of the read-only endpoint (typically
                  5433). When 0, read replicas use the same port as Port.
                format: int32
                type: integer
              readyObservedAt:
                description: |-
                  ReadyObservedAt is when the cluster was first observed with status "ready". Used to require the cluster
                  to remain ready for a minimum duration before setting the Ready condition to true.
                format: date-time
                type: string
              resourceId:
                description: ResourceID is the Thalassa identity of the DB cluster.
                type: string
              resourceStatus:
                description: ResourceStatus is the status of the resource in Thalassa
                  (e.g. ready, pending).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.instances
        statusReplicasPath: .status.instanceCount
      status: {}
