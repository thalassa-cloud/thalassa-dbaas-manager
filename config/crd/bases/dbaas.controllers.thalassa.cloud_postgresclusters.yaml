                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are applied to the resource in Thalassa.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels are applied to the resource in Thalassa.
                    type: object
                  name:
                    description: Name overrides the name of the resource in Thalassa.
                      If not set, the Kubernetes object name is used.
                    type: string
                type: object
              onDelete:
