apiVersion: dbaas.controllers.thalassa.cloud/v1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: thalassa-dbaas-manager
    app.kubernetes.io/managed-by: kustomize
  name: postgrescluster-sample
spec:
  # subnetRef is optional: omit to use the manager's default-subnet-id, or set identity to a Thalassa subnet ID
  # subnetRef:
  #   identity: subnet-identity
  # Optional: attach security groups by Thalassa identity
  # securityGroupRefs:
  #   - identity: sg-identity
  # onDelete: BackupAndDelete
  onDelete: Delete
  dbObjectStore:
  #   identity: os-identity
    dbObjectStoreRef:
      apiGroup: dbaas.controllers.thalassa.cloud
      kind: DbObjectStore
      name: dbobjectstore-sample
  # Optional: recurring backup schedules (barman); matched by name in Thalassa. Use PostgresClusterBackupSchedule CR for method/retention.
  backupSchedules:
    - name: weekly
      schedule: "0 2 * * 0"
      description: "Weekly backup"
  #   - name: daily
  #     schedule: "0 6 * * *"
  #     description: "Daily backup"
  postgresVersion: "18"
  instanceType:
    id: db-pgp-micro
  storageGB: 2
  volumeTypeClassId: block
  instances: 1
  # description: "Sample PostgreSQL cluster"
