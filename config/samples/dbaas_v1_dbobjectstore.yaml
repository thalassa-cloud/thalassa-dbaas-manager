apiVersion: dbaas.controllers.thalassa.cloud/v1
kind: DbObjectStore
metadata:
  name: dbobjectstore-sample
  labels:
    app.kubernetes.io/name: thalassa-dbaas-manager
    app.kubernetes.io/managed-by: kustomize
spec:
  # Optional, region slug. If omitted, manager uses REGION or discovers from default subnet.
  # region: nl-01
  description: "Sample object store for DB backups"
  retentionPolicy: "30d"
  deleteProtection: true
  # Optional Thalassa labels/annotations (API); use spec.metadata for name/label overrides
  # annotations:
  #   example.com/owner: team-a
  # metadata:
  #   name: my-store-in-thalassa
  #   labels:
  #     env: production
