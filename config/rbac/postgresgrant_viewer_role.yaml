# This rule is not used by the project thalassa-dbaas-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dbaas.controllers.thalassa.cloud resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: thalassa-dbaas-manager
    app.kubernetes.io/managed-by: kustomize
  name: postgresgrant-viewer-role
rules:
- apiGroups:
  - dbaas.controllers.thalassa.cloud
  resources:
  - postgresgrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dbaas.controllers.thalassa.cloud
  resources:
  - postgresgrants/status
  verbs:
  - get
