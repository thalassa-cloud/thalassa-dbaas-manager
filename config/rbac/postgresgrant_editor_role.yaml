# This rule is not used by the project thalassa-dbaas-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dbaas.controllers.thalassa.cloud.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: thalassa-dbaas-manager
    app.kubernetes.io/managed-by: kustomize
  name: postgresgrant-editor-role
rules:
- apiGroups:
  - dbaas.controllers.thalassa.cloud
  resources:
  - postgresgrants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dbaas.controllers.thalassa.cloud
  resources:
  - postgresgrants/status
  verbs:
  - get
