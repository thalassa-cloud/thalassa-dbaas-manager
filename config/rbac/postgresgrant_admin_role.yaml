# This rule is not used by the project thalassa-dbaas-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over dbaas.controllers.thalassa.cloud.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: thalassa-dbaas-manager
    app.kubernetes.io/managed-by: kustomize
  name: postgresgrant-admin-role
rules:
- apiGroups:
  - dbaas.controllers.thalassa.cloud
  resources:
  - postgresgrants
  verbs:
  - '*'
- apiGroups:
  - dbaas.controllers.thalassa.cloud
  resources:
  - postgresgrants/status
  verbs:
  - get
